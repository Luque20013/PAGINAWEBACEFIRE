<style>
/* ===== TOKENS: oscuro (cancha de noche, por defecto) y claro (cancha de día) ===== */
:root {
  --s950: 244 246 249; --s900: 255 255 255; --s800: 226 230 237; --s700: 208 213 221; --s600: 152 162 179;
  --s500: 123 133 153; --s400: 91 102 122; --s300: 61 72 92; --s200: 29 41 57; --s100: 16 24 40; --s50: 16 24 40;
  --fire: 244 81 30;
  --am300: 232 89 12; --am400: 217 72 15; --am500: 244 81 30; --am600: 200 60 10;
  --em300: 11 122 85; --em400: 14 143 99; --em500: 18 178 122; --em600: 14 159 110;
  --ro300: 190 18 60; --ro400: 225 29 72; --ro500: 244 63 94; --ro600: 225 29 72;
  --bl200: 30 64 175; --bl400: 37 99 235; --bl500: 59 130 246; --bl600: 37 99 235;
  --cy400: 14 116 144; --cy500: 6 182 212; --pu400: 126 34 206; --pu500: 168 85 247;
}
:root[data-theme="dark"] {
  --s950: 7 11 20; --s900: 14 21 36; --s800: 30 41 64; --s700: 44 58 87; --s600: 74 90 122;
  --s500: 124 139 166; --s400: 154 167 190; --s300: 188 198 216; --s200: 220 227 239; --s100: 238 242 248; --s50: 248 250 253;
  --fire: 255 106 43;
  --am300: 255 192 120; --am400: 255 169 77; --am500: 255 106 43; --am600: 234 88 12;
  --em300: 110 231 183; --em400: 52 211 153; --em500: 16 185 129; --em600: 5 150 105;
  --ro300: 253 164 175; --ro400: 251 113 133; --ro500: 244 63 94; --ro600: 225 29 72;
  --bl200: 191 219 254; --bl400: 96 165 250; --bl500: 59 130 246; --bl600: 37 99 235;
  --cy400: 34 211 238; --cy500: 6 182 212; --pu400: 192 132 252; --pu500: 168 85 247;
}
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  font-family: 'Archivo', system-ui, sans-serif;
  background-color: rgb(var(--s950));
  background-image:
    radial-gradient(900px 520px at 50% -140px, rgb(var(--fire) / .17), transparent 70%),
    radial-gradient(700px 420px at 100% 100%, rgb(var(--bl500) / .10), transparent 70%);
  background-attachment: fixed;
  color: rgb(var(--s100));
  -webkit-font-smoothing: antialiased;
}
html[data-theme="light"] body {
  background-image:
    radial-gradient(900px 480px at 50% -160px, rgb(var(--fire) / .10), transparent 70%);
}
/* Marca */
.logo { font-family: 'Archivo', system-ui, sans-serif; font-stretch: 125%; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: rgb(var(--s100)); }
.fire { color: rgb(var(--fire)); }
.logo .fire { background: linear-gradient(135deg, #FFB347, rgb(var(--fire)) 60%, #E8340F); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.af-mark { width: 32px; height: 32px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; background: linear-gradient(135deg, #FF8A3D, #E8340F); box-shadow: 0 6px 16px -6px rgb(var(--fire) / .8), inset 0 1px 0 rgb(255 255 255 / .35); }
.num { font-stretch: 62%; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: .9; }
.font-mono { font-family: 'Archivo', system-ui, sans-serif !important; font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; }
/* Cabecera y barra inferior flotante */
.hdr { background: rgb(var(--s900) / .78); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid rgb(var(--s100) / .07); }
.tabbar {
  left: 50% !important; right: auto !important; transform: translateX(-50%);
  width: calc(100% - 20px); max-width: 640px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
  background: rgb(var(--s900) / .82);
  -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid rgb(var(--s100) / .09); border-radius: 22px; padding: 4px;
  box-shadow: 0 18px 40px -12px rgb(0 0 0 / .55), 0 1px 0 rgb(255 255 255 / .05) inset;
}
html[data-theme="light"] .tabbar { box-shadow: 0 14px 34px -12px rgb(16 24 40 / .28); }
.af-tab { border-radius: 16px; transition: background .2s ease, color .2s ease; }
.af-tab-on { background: rgb(var(--fire) / .15); }
/* Tarjetas */
.af-card { background-image: linear-gradient(180deg, rgb(var(--s100) / .04), transparent 55%); border-color: rgb(var(--s100) / .08); box-shadow: 0 1px 0 rgb(255 255 255 / .04) inset, 0 12px 28px -16px rgb(0 0 0 / .6); }
html[data-theme="light"] .af-card { background-image: none; border-color: rgb(var(--s700) / .7); box-shadow: 0 1px 2px rgb(16 24 40 / .05), 0 10px 26px -18px rgb(16 24 40 / .25); }
.af-inp { transition: border-color .15s ease, box-shadow .15s ease; }
.af-inp:focus { box-shadow: 0 0 0 3px rgb(var(--fire) / .18); }
/* Avatares */
.af-emoji { background: linear-gradient(145deg, rgb(var(--s800)), rgb(var(--s900))); border: 1px solid rgb(var(--fire) / .35); box-shadow: 0 0 0 2px rgb(var(--s950)), 0 0 0 3px rgb(var(--fire) / .25); }
/* Botones */
.btn-fire { background: linear-gradient(135deg, #FF8A3D 0%, rgb(var(--fire)) 50%, #E8340F 100%); color: #fff; font-weight: 800; box-shadow: 0 8px 20px -8px rgb(var(--fire) / .75), inset 0 1px 0 rgb(255 255 255 / .28); transition: filter .15s ease, transform .1s ease, box-shadow .15s ease; }
.btn-fire:hover { filter: brightness(1.07); box-shadow: 0 10px 24px -8px rgb(var(--fire) / .9), inset 0 1px 0 rgb(255 255 255 / .28); }
.btn-fire:active { transform: scale(.98); }
.fire-on { animation: pop .35s ease; }
@keyframes pop { 30% { transform: scale(1.12); } 100% { transform: scale(1); } }
.enter { animation: enter .22s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bar { background: linear-gradient(90deg, #FF8A3D, rgb(var(--fire))); transition: width .5s ease; }
.ev-hd { background: linear-gradient(135deg, rgb(var(--fire) / .10), rgb(var(--s800) / .55)); }
.datebox { font-family: 'Archivo', system-ui, sans-serif; font-stretch: 62%; font-weight: 900; color: rgb(var(--s100)); }
/* El marcador */
.score { position: relative; background: linear-gradient(135deg, #0B1626 0%, #13274A 60%, #1B3563 100%); color: #fff; border-radius: 22px; overflow: hidden; display: block; width: 100%; box-shadow: 0 18px 40px -18px rgb(var(--fire) / .55), 0 0 0 1px rgb(255 255 255 / .06) inset; }

function useCol(name, q) {
  const [d, setD] = useState(null);
  useEffect(() => (q ? q(db.collection(name)) : db.collection(name)).onSnapshot(
    (s) => setD(s.docs.map((x) => ({ id: x.id, ...x.data() }))),
    (e) => { console.error(e); setD([]); }
  ), [name]);
  return d;
}

const fileToDataUrl = (file, max = 900, q = 0.72) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = () => rej(new Error('read'));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => rej(new Error('img'));
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let out = c.toDataURL('image/jpeg', q);
      if (out.length > 600000) out = c.toDataURL('image/jpeg', 0.5);
      res(out);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

// ===== ACCESO: LOGIN / REGISTRO / COMPLETAR PERFIL =====
function Auth({ user, setReg = () => {} }) {
  const [mode, setMode] = useState(user ? 'complete' : 'login');
  const [acc, setAcc] = useState({ email: '', pass: '' });
  const [f, setF] = useState({
    name: (user && user.displayName) || '',
    nickname: '',
    phone: '',
    birthday: '',
    position: 'punta',
    avatar: '🏐',
    skills: Object.fromEntries(SK.map((k) => [k, 3]))
  });
  const [err, setErr] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);

  const msg = (e) => ({
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/invalid-email': 'El correo no es válido.',
    'auth/email-already-in-use': 'Ese correo ya tiene cuenta. Inicia sesión.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/missing-password': 'Escribe tu contraseña.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
    'auth/operation-not-allowed': 'Falta activar Correo/Contraseña en Firebase Authentication.',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar.',
    'auth/popup-blocked': 'Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes.',
    'auth/unauthorized-domain': 'Este link no está autorizado en Firebase (Authentication > Configuración > Dominios autorizados).',
    'auth/operation-not-supported-in-this-environment': 'Entrar con Google solo funciona desde un link publicado (como Netlify), no abriendo el archivo local.',
    'auth/configuration-not-found': 'Falta activar Authentication en Firebase (Comenzar, y luego Correo/Contraseña).'
  }[e.code] || ('Error: ' + (e.code || e.message)));

  const login = async (e) => {
    e.preventDefault(); setErr(''); setInfo(''); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(acc.email.trim(), acc.pass);
    } catch (x) {
      setErr(msg(x));
    }
    setBusy(false);
  };

  const reset = async () => {
    setErr(''); setInfo('');
    if (!acc.email.trim()) return setErr('Escribe tu correo y vuelve a pulsar "Olvidé mi contraseña".');
    try {
      await auth.sendPasswordResetEmail(acc.email.trim());
      setInfo('Te enviamos un correo para restablecer tu contraseña.');
    } catch (x) {
      setErr(msg(x));
    }
  };

  const google = async () => {
    setErr(''); setInfo('');
    try {
      await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch (x) {
      setErr(msg(x));
    }
  };

  const register = async (e) => {
    e.preventDefault(); setErr(''); if (!f.name.trim()) return;
    setBusy(true); setReg(true);
    try {
      const u = user || (await auth.createUserWithEmailAndPassword(acc.email.trim(), acc.pass)).user;
      const nick = f.nickname.trim() || f.name.trim().split(' ')[0];
      const emailLower = (u.email || acc.email || '').toLowerCase().trim();

      await db.collection('players').doc(u.uid).set({
        ...f,
        email: emailLower,
        name: f.name.trim(),
        nickname: nick,
        birthday: f.birthday ? f.birthday.slice(5) : '',
        matchesWon: 0,
        matchesLost: 0,
        setsWon: 0,
        mvpCount: 0,
        isAdmin: false,
        createdAt: Date.now()
      });

      await db.collection('posts').add({
        authorId: u.uid,
        authorName: f.name.trim(),
        nick,
        avatar: f.avatar,
        content: `🎉 ¡Bienvenido/a ${nick} a la comunidad AceFire! Juega de ${POS.find((p) => p.id === f.position).label}. ¡A darlo todo en la cancha! 🔥🏐`,
        badge: '👋 Nuevo fichaje',
        likes: [],
        comments: [],
        createdAt: Date.now()
      });
    } catch (x) {
      setErr(msg(x));
    }
    setReg(false); setBusy(false);
  };

  return (
    <div className="relative z-10 max-w-md mx-auto p-4 space-y-4">
      <div className="text-center pt-6 space-y-1">
        <h1 className="flex justify-center"><img src={LOGO_FULL} alt="AceFire" className="enter" style={{ width: 210, height: 210, borderRadius: 36, boxShadow: '0 18px 50px -16px rgb(212 160 40 / .5)' }} /></h1>
        <p className="text-sm text-slate-400 pt-2">Anótate a las pichangas, sigue el ranking y arma equipos.</p>
      </div>

      {evHash() && <p className="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-center">🏐 Inicia sesión o crea tu cuenta para anotarte a la pichanga.</p>}
      {hashId() && <p className="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-center">🔒 Inicia sesión o crea tu cuenta para ver este perfil.</p>}

      <WaJoin />

      {err && <p className="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-xl p-3">{err}</p>}
      {info && <p className="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3">{info}</p>}

      {mode !== 'complete' && (
        <div className="space-y-2">
          <button type="button" onClick={google} className="w-full py-2.5 rounded-xl bg-slate-100 text-slate-900 font-bold text-sm shadow hover:bg-white flex items-center justify-center gap-2 transition">
            <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Continuar con Google
          </button>
          <p className="text-center text-xs text-slate-500">o con tu correo y contraseña</p>
        </div>
      )}

      {mode === 'login' ? (
        <form onSubmit={login} className={card + ' space-y-3'}>
          <p className="text-sm font-bold text-amber-400">Entrar a mi cuenta</p>
          <input type="email" required autoComplete="email" className={inp} placeholder="Correo electrónico" value={acc.email} onChange={(e) => setAcc({ ...acc, email: e.target.value })} />
          <input type="password" required autoComplete="current-password" className={inp} placeholder="Contraseña" value={acc.pass} onChange={(e) => setAcc({ ...acc, pass: e.target.value })} />
          <button disabled={busy} className="btn-fire w-full py-2.5 rounded-xl text-sm disabled:opacity-50">{busy ? 'Entrando...' : 'Entrar'}</button>
          <div className="flex justify-between items-center text-xs pt-1">
            <button type="button" onClick={reset} className="text-slate-400 underline">Olvidé mi contraseña</button>
            <button type="button" onClick={() => { setErr(''); setInfo(''); setMode('register'); }} className="text-amber-400 font-bold hover:underline">Crear cuenta nueva</button>
          </div>
        </form>
      ) : (
        <form onSubmit={register} className={card + ' space-y-3'}>
          <p className="text-sm font-bold text-amber-400">{mode === 'complete' ? 'Completa tu ficha deportiva' : 'Crear mi cuenta de jugador'}</p>
          {mode === 'register' && (
            <>
              <input type="email" required autoComplete="email" className={inp} placeholder="Correo electrónico *" value={acc.email} onChange={(e) => setAcc({ ...acc, email: e.target.value })} />
              <input type="password" required minLength="6" autoComplete="new-password" className={inp} placeholder="Contraseña (mínimo 6 caracteres) *" value={acc.pass} onChange={(e) => setAcc({ ...acc, pass: e.target.value })} />
            </>
          )}
          <input required className={inp} placeholder="Nombre completo *" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} />
          <input className={inp} placeholder="Apodo en la cancha (ej. Justin, Charly)" value={f.nickname} onChange={(e) => setF({ ...f, nickname: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-[11px] text-slate-400 mb-1">Posición Principal</label>
              <select className={inp} value={f.position} onChange={(e) => setF({ ...f, position: e.target.value })}>
                {POS.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-[11px] text-slate-400 mb-1">Avatar / Emblema</label>
              <select className={inp} value={f.avatar} onChange={(e) => setF({ ...f, avatar: e.target.value })}>
                {AV.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
          </div>

          <details className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
            <summary className="text-xs font-bold text-amber-400 cursor-pointer">+ Completar más datos (opcional)</summary>
            <div className="space-y-3 pt-3">
          <input className={inp} placeholder="WhatsApp (ej. 51931039742)" value={f.phone} onChange={(e) => setF({ ...f, phone: e.target.value })} />
          
          <label className="block text-xs text-slate-400">
            Cumpleaños (para avisos y saludos en el muro)
            <input type="date" className={inp + ' mt-1'} value={f.birthday} onChange={(e) => setF({ ...f, birthday: e.target.value })} />
          </label>

          <div className="pt-2">
            <div className="flex justify-between items-center mb-1">
              <span className="text-xs font-bold text-amber-400">Autocalificación por Fundamentos (1 al 5)</span>
              <span className="text-[11px] font-mono text-amber-300">⭐ {ovr(f.skills).toFixed(1)} OVR</span>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {SK.map((k) => (
                <div key={k} className="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs">
                  <div className="flex justify-between mb-1">
                    <span className="capitalize text-slate-400">{k}</span>
                    <b className="text-amber-400">{f.skills[k]}</b>
                  </div>
                  <input type="range" min="1" max="5" value={f.skills[k]} className="w-full accent-orange-500 cursor-pointer" onChange={(e) => setF({ ...f, skills: { ...f.skills, [k]: +e.target.value } })} />
                </div>
              ))}
            </div>
          </div>

            </div>
          </details>

          <button disabled={busy} className="btn-fire w-full py-2.5 rounded-xl text-sm disabled:opacity-50 mt-2">
            {busy ? 'Guardando...' : mode === 'complete' ? 'Guardar mi perfil' : 'Crear cuenta y entrar'}
          </button>
          
          <div className="text-center pt-1">
            {mode === 'register' ? (
              <button type="button" onClick={() => { setErr(''); setMode('login'); }} className="text-xs text-amber-400 font-bold hover:underline">Ya tengo cuenta, iniciar sesión</button>
            ) : (
              <button type="button" onClick={() => auth.signOut()} className="text-xs text-slate-400 underline">Cerrar sesión</button>
            )}
          </div>
        </form>
      )}
    </div>
  );
}

// ===== MURO SOCIAL (TIPO FACEBOOK) =====
function NextMatch({ events, me, onGo, isAdmin }) {
  const ev = events.filter((e) => e.date && when(e) >= Date.now() - 6 * 36e5).sort((a, b) => when(a) - when(b))[0];
  if (!ev) {
    return (
      <div className="score p-4 flex items-center justify-between gap-3">
        <div>
          <p className="text-sm font-bold">No hay pichanga convocada</p>
          <p className="text-xs mt-0.5" style={{ color: 'rgba(255,255,255,.6)' }}>
            {isAdmin ? 'Convoca la próxima para que la gente se anote.' : 'Cuando los admins convoquen una, aparecerá aquí.'}
          </p>
        </div>
        {isAdmin && <button onClick={onGo} className="btn-fire px-3 py-2 rounded-xl text-xs shrink-0">Convocar pichanga</button>}
      </div>
    );
  }
  const d = when(ev), g = effGoing(ev), cap = ev.cap || 12, iGo = g.includes(me.id);
  return (
    <button onClick={onGo} className="score text-left">
      <div className="flex items-stretch">
        <div className="score-date">
          <div className="num text-5xl">{d.getDate()}</div>
          <div className="text-xs font-bold mt-1">{MS[d.getMonth()]}</div>
        </div>
        <div className="flex-1 min-w-0 p-3.5 flex flex-col justify-center">
          <p className="text-[11px]" style={{ color: 'rgba(255,255,255,.6)' }}>Próxima pichanga</p>
          <b className="block truncate text-base">{ev.title}</b>
          <p className="text-xs" style={{ color: 'rgba(255,255,255,.7)' }}>{ev.time} hrs, {placeTxt(ev) || (mapsOf(ev) ? 'ubicación en el mapa' : 'lugar por definir')}</p>
          <p className="text-[11px] font-bold mt-0.5" style={{ color: '#FFB27A' }}>{left(ev)}</p>
        </div>
        <div className="p-3.5 flex flex-col items-end justify-center shrink-0">
          <div className="num text-4xl">{Math.min(g.length, cap)}<span style={{ color: 'rgba(255,255,255,.4)' }} className="text-2xl">/{cap}</span></div>
          <p className="text-[10px] mt-1" style={{ color: iGo ? '#6EE7B7' : 'rgba(255,255,255,.6)' }}>{iGo ? 'Ya estás anotado' : g.length >= cap ? 'Lista de espera' : 'Toca para anotarte'}</p>
        </div>
      </div>
      <div className="h-1" style={{ background: 'rgba(255,255,255,.1)' }}>
        <div className="bar h-full" style={{ width: Math.min(100, (g.length / cap) * 100) + '%' }} />
      </div>
    </button>
  );
}

function PostComposer({ me, isAdmin, wallOwner, placeholder, showCats }) {
  const [txt, setTxt] = useState('');
  const [cat, setCat] = useState('Pichanga');
  const [img, setImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const other = wallOwner && wallOwner !== me.id;

  const pickImg = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { setImg(await fileToDataUrl(f)); }
    catch (x) { alert('No se pudo cargar esa foto. Prueba con otra.'); }
  };

  const pub = async (e) => {
    e.preventDefault();
    if ((!txt.trim() && !img) || busy) return;
    setBusy(true);
    try {
      await db.collection('posts').add({
        authorId: me.id,
        authorName: me.name,
        nick: me.nickname,
        avatar: me.avatar,
        content: txt.trim(),
        ...(img ? { image: img } : {}),
        ...(other ? { wallOwner } : {}),
        badge: other ? '💬 En el muro' : showCats ? (cat === 'Oficial' ? '📢 Oficial Admin' : cat === 'Pichanga' ? '🏐 Crónica de juego' : '📢 Aviso') : '',
        likes: [],
        comments: [],
        createdAt: Date.now()
      });
      setTxt(''); setImg(null);
    } catch (x) {
      alert('No se pudo publicar. Inténtalo otra vez.');
    }
    setBusy(false);
  };

  return (
    <form onSubmit={pub} className={card + ' space-y-2.5'}>
      <div className="flex gap-2.5 items-center">
        <Av p={me} />
        <textarea rows={2} className={inp + ' resize-none'} placeholder={placeholder} value={txt} onChange={(e) => setTxt(e.target.value)} />
      </div>
      {img && (
        <div className="relative">
          <img src={img} alt="" className="rounded-xl max-h-64 w-full object-cover" />
          <button type="button" onClick={() => setImg(null)} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/70 text-white text-xs">✕</button>
        </div>
      )}
      <div className="flex flex-wrap justify-between items-center gap-2 pt-1 border-t border-slate-800/80">
        <div className="flex gap-1">
          {showCats && ['Pichanga', 'Aviso', ...(isAdmin ? ['Oficial'] : [])].map((c) => (
            <button type="button" key={c} onClick={() => setCat(c)} className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${cat === c ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'text-slate-400 hover:text-slate-200'}`}>
              {c === 'Pichanga' ? '🏐 Pichanga' : c === 'Oficial' ? '⭐ Comunicado Admin' : '📢 Aviso'}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2 ml-auto">
          <label className="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 cursor-pointer transition">
            📷 Foto
            <input type="file" accept="image/*" className="hidden" onChange={pickImg} />
          </label>
          <button disabled={busy || (!txt.trim() && !img)} className="px-4 py-1.5 btn-fire rounded-xl text-xs font-bold disabled:opacity-40">{busy ? 'Publicando…' : 'Publicar'}</button>
        </div>
      </div>
    </form>
  );
}

  const canDelete = isAdmin || p.authorId === me.id || p.wallOwner === me.id;
  const hasFuego = (p.likes || []).includes(me.id);
  const author = p.authorId !== 'bot' ? players.find((x) => x.id === p.authorId) : null;

  const like = () => db.collection('posts').doc(p.id).update({ likes: hasFuego ? FV.arrayRemove(me.id) : FV.arrayUnion(me.id) });

    await db.collection('posts').doc(p.id).update({

function Ranking({ players, onProfile }) {
  const rows = useMemo(() => [...players].sort((a, b) => {
    const ta = (a.matchesWon || 0) + (a.matchesLost || 0);
    const tb = (b.matchesWon || 0) + (b.matchesLost || 0);
    const wa = ta ? (a.matchesWon || 0) / ta : 0;
    const wb = tb ? (b.matchesWon || 0) / tb : 0;
    return wb - wa || (b.matchesWon || 0) - (a.matchesWon || 0) || (b.setsWon || 0) - (a.setsWon || 0);
  }), [players]);

  const eff = (p) => { const t = (p.matchesWon || 0) + (p.matchesLost || 0); return t ? Math.round(((p.matchesWon || 0) / t) * 100) : 0; };
  const top = rows.slice(0, 3);
  const podium = top.length === 3 ? [[top[1], 2, '🥈'], [top[0], 1, '👑'], [top[2], 3, '🥉']] : [];

  return (
    <div className="space-y-3">
    {podium.length > 0 && (

                <div>
                  <div className="flex items-center gap-1.5">

  const teams = [0, 1, 2].map((i) => ({

// ===== Triangular: el que gana se queda (nadie juega 3 partidos seguidos) =====
function Triangular({ tri, players, isAdmin }) {
  const [sa, setSa] = useState(0); const [sb, setSb] = useState(0); const [mvp, setMvp] = useState(''); const [busy, setBusy] = useState(false);
  if (!tri) return null;
  const T = tri.teams, games = tri.games || [], x = tri.cur[0], y = tri.cur[1], w = tri.wait, consec = tri.consec || [0, 0, 0];
  const st = T.map((t, i) => ({ i, name: t.name, pj: 0, g: 0, p: 0, sf: 0, sc: 0 }));
  games.forEach((g) => { const A = st[g.a], B = st[g.b]; A.pj++; B.pj++; A.sf += g.sa; A.sc += g.sb; B.sf += g.sb; B.sc += g.sa; if (g.sa > g.sb) { A.g++; B.p++; } else { B.g++; A.p++; } });
  const table = [...st].sort((p, q) => q.g - p.g || (q.sf - q.sc) - (p.sf - p.sc) || q.sf - p.sf);
  const opts = [...T[x].ids, ...T[y].ids].map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const save = async () => {
    if (sa === sb) return alert('No puede haber empate: un equipo debe ganar más sets.');
    setBusy(true);
    try {
      const win = sa > sb ? x : y, lose = sa > sb ? y : x, ws = Math.max(sa, sb);
      const c = [...consec]; c[x] += 1; c[y] += 1;
      let cur, wait;
      if (c[win] >= tri.max) { cur = [lose, w]; wait = win; } else { cur = [win, w]; wait = lose; }
      c[wait] = 0;
      const b = db.batch();
      T[win].ids.forEach((id) => b.update(db.collection('players').doc(id), { matchesWon: FV.increment(1), setsWon: FV.increment(ws) }));
      T[lose].ids.forEach((id) => b.update(db.collection('players').doc(id), { matchesLost: FV.increment(1) }));
      if (mvp) b.update(db.collection('players').doc(mvp), { mvpCount: FV.increment(1) });
      b.set(db.collection('matches').doc(), { teamA: T[x].ids, teamB: T[y].ids, scoreA: sa, scoreB: sb, mvp, createdAt: Date.now() });
      b.update(db.collection('triangulars').doc(tri.id), { games: FV.arrayUnion({ a: x, b: y, sa, sb, at: Date.now() }), cur, wait, consec: c });
      await b.commit();
      setSa(0); setSb(0); setMvp('');
    } catch (e) { alert('No se pudo guardar: ' + e.message); }
    setBusy(false);
  };
  const finish = async () => {
    if (!confirm('¿Terminar el triangular y publicar la tabla final en el muro?')) return;
    const lines = table.map((r, k) => `${k + 1}. ${r.name}: ${r.g} G / ${r.p} P (sets ${r.sf}-${r.sc})`).join('\n');
    await db.collection('posts').add({ authorId: 'bot', authorName: 'AceFire', nick: 'arbitro', avatar: '🏆', content: `🏆 Triangular terminado (${games.length} partidos)\n${lines}\n🔥 Campeón: ${table[0].name}`, badge: '🏆 Triangular', likes: [], comments: [], createdAt: Date.now() });
    await db.collection('triangulars').doc(tri.id).update({ active: false });
  };
  const box = (i) => (
    <div className="rounded-xl border border-amber-500/40 bg-slate-950 p-2">
      <b className="text-sm">{T[i].name}</b>
      {T[i].cap && <p className="text-[10px] text-amber-400">👑 {(players.find((p) => p.id === T[i].cap) || {}).nickname}</p>}
      <p className="text-[10px] text-slate-400">{T[i].ids.map((id) => (players.find((p) => p.id === id) || {}).nickname).filter(Boolean).join(', ')}</p>
      <p className="text-[10px] mt-1 text-amber-400 font-bold">{consec[i] + 1 >= tri.max ? 'Si gana, descansa' : 'Si gana, se queda'}</p>
    </div>
  );
  return (
    <section className={card + ' mb-4 space-y-3 enter'}>
      <div className="flex items-center justify-between"><b>🔥 Triangular en vivo</b><span className="text-xs text-slate-400">{games.length} partidos</span></div>
      <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 text-center">{box(x)}<span className="font-black text-amber-400">VS</span>{box(y)}</div>
      <p className="text-xs text-center text-slate-400">⏳ Espera: <b className="text-amber-400">{T[w].name}</b> · nadie juega 3 partidos seguidos</p>
      {isAdmin && (
        <div className="space-y-2 border-t border-slate-800 pt-3">
          <div className="grid grid-cols-2 gap-2">
            <label className="text-xs text-slate-400">Sets {T[x].name}<input type="number" min="0" max="9" className={inp + ' mt-1 text-center'} value={sa} onChange={(e) => setSa(+e.target.value || 0)} /></label>
            <label className="text-xs text-slate-400">Sets {T[y].name}<input type="number" min="0" max="9" className={inp + ' mt-1 text-center'} value={sb} onChange={(e) => setSb(+e.target.value || 0)} /></label>
          </div>
          <select className={inp} value={mvp} onChange={(e) => setMvp(e.target.value)}><option value="">⭐ MVP del partido (opcional)</option>{opts.map((p) => <option key={p.id} value={p.id}>{p.nickname}</option>)}</select>
          <div className="flex gap-2">
            <button disabled={busy} onClick={save} className="btn-fire flex-1 py-2.5 rounded-xl text-xs font-black disabled:opacity-50">{busy ? 'Guardando...' : 'Guardar partido y pasar al siguiente'}</button>
            <button onClick={finish} className="px-3 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">Terminar</button>
          </div>
        </div>
      )}
      <div className="border-t border-slate-800 pt-3">
        <div className="grid grid-cols-[1fr_repeat(4,2rem)] gap-1 text-[11px] text-slate-500 font-bold px-1"><span>Equipo</span><span className="text-center">PJ</span><span className="text-center">G</span><span className="text-center">P</span><span className="text-center">Sets</span></div>
        {table.map((r, k) => (
          <div key={r.i} className={`grid grid-cols-[1fr_repeat(4,2rem)] gap-1 text-xs px-1 py-1.5 rounded-lg ${k === 0 && games.length ? 'bg-amber-500/10' : ''}`}>
            <span className="font-bold">{k === 0 && games.length ? '👑 ' : ''}{r.name}</span><span className="text-center">{r.pj}</span><span className="text-center text-emerald-400 font-bold">{r.g}</span><span className="text-center text-rose-400">{r.p}</span><span className="text-center">{r.sf}-{r.sc}</span>

        ))}

    </section>
  );
}

function Teams({ players, events, initialEv, onRegister, onStartTri, isAdmin }) {
  const [off, setOff] = useState([]);
  const upcoming = events.filter((e) => e.date && when(e) >= Date.now() - 6 * 36e5).sort((a, b) => when(a) - when(b));
  const [sel, setSel] = useState(initialEv || (upcoming[0] ? upcoming[0].id : 'all'));
  const ev = events.find((e) => e.id === sel);
  const opts = ev && !upcoming.find((e) => e.id === ev.id) ? [ev, ...upcoming] : upcoming;
  const base = ev ? effGoing(ev).slice(0, ev.cap || 12).map((id) => players.find((p) => p.id === id)).filter(Boolean) : players;
  const waiting = ev ? Math.max(0, effGoing(ev).length - (ev.cap || 12)) : 0;

  const [n, setN] = useState(2);
  const [res, setRes] = useState(null);
  const [ok, setOk] = useState(false);

  const pool = base.filter((p) => !off.includes(p.id));

  const gen = () => {
    const T = Array.from({ length: n }, (_, i) => ({
      name: 'Equipo ' + String.fromCharCode(65 + i),
      pl: [],
      tot: 0
    }));

    // Reparto por posiciones para garantizar balance técnico
    ['armador', 'central', 'punta', 'opuesto', 'libero'].forEach((pos) => {
      pool.filter((p) => p.position === pos)
        .sort((a, b) => ovr(b.skills) - ovr(a.skills))
        .forEach((p) => {
          T.sort((a, b) => 
            (a.pl.filter((x) => x.position === pos).length - b.pl.filter((x) => x.position === pos).length) ||
            (a.pl.length - b.pl.length) ||
            (a.tot - b.tot)
          );
          T[0].pl.push(p);
          T[0].tot += ovr(p.skills);
        });
    });

    setRes(T.sort((a, b) => a.name.localeCompare(b.name)));
  };

  const copy = (sendWa) => {
    let t = '🏐 *ACEFIRE - EQUIPOS BALANCEADOS* 🏐\n' + (ev ? `📅 ${ev.title} · ${ev.date} ${ev.time}\n` : '') + '\n';
    res.forEach((e) => {
      const avg = (e.tot / (e.pl.length || 1)).toFixed(1);
      t += `🔥 *${e.name.toUpperCase()}* (Nivel: ⭐ ${avg})\n`;
      e.pl.forEach((p, i) => {
        const badge = POS.find((x) => x.id === p.position)?.s || 'JUG';
        t += `  ${i + 1}. ${p.nickname} [${badge}]\n`;
      });
      t += '\n';
    });
    const full = t + '⏰ Llegar 15 min antes para calentar y armar la cancha.\n\n🔥 Ranking y resultados: ' + SITE_URL;
    if (navigator.clipboard) navigator.clipboard.writeText(full).catch(() => {});
    if (sendWa === true) waShare(full);
    setOk(true);
    setTimeout(() => setOk(false), 2500);
  };

  return (
    <div className="space-y-3">
      <div className={card + ' space-y-3'}>
        <div className="flex justify-between items-center">
          <p className="text-sm font-bold text-amber-400">{ev ? 'Convocados de la pichanga' : 'Selecciona quiénes vinieron hoy'} ({pool.length} activos)</p>
          <button onClick={() => setOff([])} className="text-xs text-slate-400 hover:text-slate-200 underline">Marcar todos</button>
        </div>

        <select className={inp} value={sel} onChange={(e) => { setSel(e.target.value); setOff([]); setRes(null); }}>
          {opts.map((e) => <option key={e.id} value={e.id}>🏐 {e.title} · {e.date} {e.time} ({Math.min(effGoing(e).length, e.cap || 12)} convocados)</option>)}
          <option value="all">👥 Todos los jugadores (manual)</option>
        </select>
        {ev && waiting > 0 && <p className="text-[11px] text-amber-400">+{waiting} en lista de espera no entran a los equipos.</p>}
        {ev && base.length === 0 && <p className="text-xs text-slate-500">Nadie se ha anotado a esta pichanga todavía.</p>}

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-60 overflow-y-auto p-1">
          {base.map((p) => {
            const isInactive = off.includes(p.id);
            return (
              <button key={p.id} onClick={() => setOff(isInactive ? off.filter((x) => x !== p.id) : [...off, p.id])} className={`p-2 rounded-xl border text-xs text-left flex justify-between items-center transition ${isInactive ? 'bg-slate-950 border-slate-800 text-slate-500 opacity-50' : 'bg-amber-500/10 border-amber-500/40 text-slate-200'}`}>
                <span className="truncate">{p.avatar} {p.nickname}</span>
                <span className="text-[10px] font-mono text-amber-400 font-bold">{ovr(p.skills).toFixed(1)}⭐</span>
              </button>
            );
          })}
        </div>

        <div className="flex justify-between items-center pt-2 border-t border-slate-800">
          <div className="flex gap-1.5">
            {[2, 3].map((k) => (
              <button key={k} onClick={() => setN(k)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${n === k ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>
                {k} Equipos
              </button>
            ))}
          </div>
          <button onClick={gen} disabled={pool.length < n * 2} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl disabled:opacity-40 shadow transition">
            Balancear Equipos
          </button>
        </div>
      </div>

      {isAdmin && onStartTri && <Draft pool={pool} onStartTri={onStartTri} />}

      {res && (
        <div className="space-y-3 enter">
          <div className="grid sm:grid-cols-2 gap-3">
            {res.map((e) => (
              <div key={e.name} className={card + ' !p-0 overflow-hidden'}>
                <div className="p-3 bg-slate-800/80 flex justify-between items-center border-b border-slate-700/50">
                  <b className="text-amber-400">{e.name}</b>
                  <span className="text-xs font-mono text-amber-300 font-bold">⭐ Prom: {(e.tot / (e.pl.length || 1)).toFixed(1)}</span>
                </div>
                <div className="p-3 divide-y divide-slate-800/80">
                  {e.pl.map((p) => (
                    <div key={p.id} className="py-1.5 flex justify-between items-center text-sm">
                      <span className="text-slate-200">{p.avatar} {p.nickname}</span>
                      <Badge id={p.position} />
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="flex flex-wrap gap-2">
            <button onClick={() => copy(true)} className="flex-1 min-w-[150px] py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow">
              Enviar al grupo de WhatsApp 💬
            </button>
            <button onClick={() => copy(false)} className="flex-1 min-w-[150px] py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition shadow">
              {ok ? '¡Copiado! ✅' : 'Copiar texto 📋'}
            </button>
            {isAdmin && res.length >= 2 && res.flatMap((t1, i) => res.slice(i + 1).map((t2) => (
              <button key={t1.name + t2.name} onClick={() => onRegister(t1.pl.map((p) => p.id), t2.pl.map((p) => p.id))} className="flex-1 min-w-[150px] py-2.5 btn-fire rounded-xl text-xs font-black shadow">
                Registrar {t1.name} vs {t2.name} 🏆
              </button>
            )))}
            {isAdmin && res.length === 3 && onStartTri && (
              <button onClick={() => onStartTri(res.map((t) => ({ name: t.name, ids: t.pl.map((p) => p.id) })))} className="w-full py-2.5 bg-amber-500 text-slate-950 rounded-xl text-xs font-black shadow">
                Iniciar triangular: el que gana se queda 🔥
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ===== CONVOCATORIA DE PICHANGA & CONTROL DE PAGOS =====
const MS = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SET', 'OCT', 'NOV', 'DIC'];
const when = (e) => new Date(`${e.date}T${e.time || '00:00'}`);
// Plazo de pago: 12 horas antes de la pichanga. Pasado el plazo, quien no pagó (ni avisó su pago) pierde el cupo.
const PAY_H = 12;
const payDeadline = (e) => when(e).getTime() - (e.payHours || PAY_H) * 36e5;
const payClosed = (e) => e.fee > 0 && Date.now() >= payDeadline(e);
const effGoing = (e) => { const g = e.going || []; return payClosed(e) ? g.filter((id) => (e.paid || {})[id]) : g; };
// Multa por llegar tarde: va al fondo del grupo
const LATE_FEE = 2;
const lateFeeOf = (e) => e.lateFee || LATE_FEE;
const fundOf = (evs, uid) => {
  let paid = 0, due = 0, mine = 0;
  evs.forEach((e) => Object.keys(e.late || {}).forEach((id) => {
    const ok = (e.latePaid || {})[id] === 'ok';
    if (ok) paid += lateFeeOf(e); else { due += lateFeeOf(e); if (id === uid) mine += lateFeeOf(e); }
  }));
  return { paid, due, mine };
};
const fmtDL = (e) => new Date(payDeadline(e)).toLocaleString('es-PE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const left = (e) => {
  const d = Math.ceil((when(e) - Date.now()) / 864e5);
  return d < 0 ? 'Ya pasó' : d === 0 ? '¡Es hoy!' : d === 1 ? 'Es mañana' : `Faltan ${d} días`;
};

const evText = (ev) => {
  const g = effGoing(ev), cap = ev.cap || 12, pl = placeTxt(ev), mp = mapsOf(ev);
  return `🏐 *${ev.title}*\n🗓 ${ev.date} · 🕗 ${ev.time}${pl ? `\n📍 ${pl}` : ''}${mp ? `\n🗺 Google Maps: ${mp}` : ''}${!pl && !mp ? '\n📍 Lugar por confirmar' : ''}${ev.fee > 0 ? `\n💰 Cuota: S/ ${ev.fee}\n💜 Yape a ${YAPE_NAME}: ${YAPE_NUM}` : ''}\n✅ ${Math.min(g.length, cap)}/${cap} confirmados\n\n🔥 Entra a la web y anótate aquí 👇\n${evLink(ev.id)}`;
};

const evOpen = (ev) => '🔥 *¡YA ESTÁ ABIERTA LA LISTA!* Anótate a la pichanga 🏐\n\n' + evText(ev);
const evSpots = (ev) => {
  const cap = ev.cap || 12, left = cap - effGoing(ev).length;
  const head = left > 0
    ? `⚠️ *¡CUPOS LIMITADOS!* Quedan solo ${left} de ${cap} lugares 🏐`
    : `🚫 *¡LISTA LLENA!* Ya están los ${cap} cupos. Aún puedes entrar a la lista de espera 🏐`;
  const mp = mapsOf(ev), pl = placeTxt(ev);
  return `${head}\n\n*${ev.title}*\n🗓 ${ev.date} · 🕗 ${ev.time}${pl ? `\n📍 ${pl}` : ''}${mp ? `\n🗺 ${mp}` : ''}\n\n${left > 0 ? 'Anótate antes de que se llene 👇' : 'Entra a la lista de espera 👇'}\n${evLink(ev.id)}`;
};

    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    setCp(key); setTimeout(() => setCp(''), 2000);

  useEffect(() => {
    if (!focusId) return;
    const t = setTimeout(() => { const el = document.getElementById('ev-' + focusId); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 250);

      authorId: 'bot',
      authorName: 'AceFire Bot',
      nick: 'arbitro',
      avatar: '📅',
      content: `📅 ¡NUEVA PICHANGA CONVOCADA!\n\n🏐 ${f.title}\n🗓 Fecha: ${f.date} | 🕗 Hora: ${f.time}${placeTxt(data) ? `\n📍 Cancha: ${placeTxt(data)}` : ''}${mapsOf(data) ? `\n🗺 Google Maps: ${mapsOf(data)}` : ''}${+f.fee ? `\n💰 Cuota: S/ ${f.fee} por persona\n💜 Yape a ${YAPE_NAME}: ${YAPE_NUM}` : ''}\n\n🔥 Anótate aquí: ${evLink(ref.id)}`,
      badge: '📅 Convocatoria',

  };

  const toggle = (ev) => {

    });

        <div className="ev-hd p-4 flex items-center gap-4">

            <div className="text-xs text-amber-400 font-bold">{MS[d.getMonth()]}</div>
          </div>

            <b className="block truncate text-base text-slate-100">{ev.title}</b>

        <div className="p-4 space-y-3">
          <div>
            <div className="flex justify-between text-xs mb-1.5">
              <span className="flex items-center gap-2"><span><b>{Math.min(g.length, ev.cap)}</b>/{ev.cap} confirmados</span>
                {!past && (ev.cap - g.length <= 0 ? <span className="af-chip af-chip-full">Llena</span> : ev.cap - g.length <= 3 ? <span className="af-chip af-chip-warn">¡Solo {ev.cap - g.length} {ev.cap - g.length === 1 ? 'cupo' : 'cupos'}!</span> : <span className="af-chip af-chip-ok">{ev.cap - g.length} cupos libres</span>)}</span>
              {g.length > ev.cap && <span className="text-amber-400 font-bold">+{g.length - ev.cap} en lista de espera</span>}
            </div>
            <div className="h-2.5 rounded-full bg-slate-800 overflow-hidden">
              <div className="bar h-full rounded-full" style={{ width: Math.min(100, (g.length / ev.cap) * 100) + '%' }} />
            </div>
          </div>

          <div className="space-y-1.5">
            <p className="text-[11px] font-bold text-amber-400">📋 Lista de convocados</p>
            <div className="grid sm:grid-cols-2 gap-x-3 gap-y-1.5">
              {Array.from({ length: ev.cap || 12 }).map((_, i) => {
                const id = g[i], p = id ? byId(id) : null, st = id ? pays[id] : null;
                return id ? (
                  <div key={i} onClick={() => p && onProfile && onProfile(p.id)} className="slot slot-on">
                    <span className="slot-n">{i + 1}</span>
                    <span>🔥</span>
                    {p && <Av p={p} size="w-6 h-6" text="text-sm" />}
                    <b className="truncate">{p ? p.nickname : 'Jugador'}</b>
                    {ev.fee > 0 && <span className="ml-auto text-xs">{st === 'ok' ? '✅' : st === 'pending' ? '⏳' : ''}</span>}
                  </div>
                ) : (
                  <div key={i} className="slot slot-off"><span className="slot-n">{i + 1}</span><span>▫️</span><span>libre</span></div>
                );
              })}
            </div>
            {g.length > (ev.cap || 12) && (
              <div className="pt-1.5 space-y-1.5">
                <p className="text-[11px] font-bold text-slate-400">⏳ Lista de espera</p>
                <div className="grid sm:grid-cols-2 gap-x-3 gap-y-1.5">
                  {g.slice(ev.cap || 12).map((id, i) => {
                    const p = byId(id);
                    return (
                      <div key={id} onClick={() => p && onProfile && onProfile(p.id)} className="slot slot-wait cursor-pointer">
                        <span className="slot-n">{(ev.cap || 12) + i + 1}</span>
                        <span>⏳</span>
                        {p && <Av p={p} size="w-6 h-6" text="text-sm" />}
                        <b className="truncate">{p ? p.nickname : 'Jugador'}</b>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {ev.late && ev.late[me.id] && (
            <p className={`text-xs rounded-xl p-2 font-bold text-center border ${(ev.latePaid || {})[me.id] === 'ok' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-rose-400 bg-rose-500/10 border-rose-500/30'}`}>
              {(ev.latePaid || {})[me.id] === 'ok' ? `⏱ Llegaste tarde: tu multa de S/ ${lateFeeOf(ev)} ya está en el fondo ✅` : `⏱ Llegaste tarde: multa de S/ ${lateFeeOf(ev)} para el fondo del grupo. Págala a un admin.`}
            </p>
          )}

          {isAdmin && Date.now() >= when(ev).getTime() && g.length > 0 && (
            <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-2.5 space-y-1.5">
              <p className="text-[11px] font-bold text-amber-400">⏱ Tardanzas · multa S/ {lateFeeOf(ev)} al fondo (solo admins)</p>
              <div className="space-y-1">
                {g.slice(0, ev.cap || 12).map((id) => {
                  const p = byId(id); if (!p) return null;
                  const late = !!(ev.late || {})[id], lp = (ev.latePaid || {})[id] === 'ok';
                  return (
                    <div key={id} className="flex items-center justify-between text-xs bg-slate-900 rounded-lg px-2 py-1.5">
                      <span>{p.nickname}{late ? <b className={lp ? ' text-emerald-400' : ' text-rose-400'}>{lp ? ' · multa cobrada ✅' : ` · debe S/ ${lateFeeOf(ev)}`}</b> : ''}</span>
                      <span className="flex gap-1">
                        {late && <button onClick={() => setLatePaid(ev, id, !lp)} className="px-2 py-0.5 rounded-lg bg-emerald-600 font-bold">{lp ? '↺' : 'Cobrada'}</button>}
                        <button onClick={() => toggleLate(ev, id)} className={`px-2 py-0.5 rounded-lg font-bold ${late ? 'bg-slate-700 text-slate-300' : 'bg-rose-600/80 text-white'}`}>{late ? 'Quitar' : 'Llegó tarde'}</button>
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {!past && !(payClosed(ev) && !inRaw) && (
            <button onClick={() => toggle(ev)} className={inRaw ? 'w-full py-2.5 rounded-xl text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition' : 'btn-fire fire-on w-full py-2.5 rounded-xl text-sm shadow transition'}>
              {inRaw ? 'No voy (salir de la lista)' : full ? 'Entrar a lista de espera' : '¡Me anoto! 🔥'}
            </button>
          )}

          {mapsOf(ev) && (
            <a href={mapsOf(ev)} target="_blank" rel="noreferrer" className="block text-center w-full py-2 rounded-xl border border-blue-500/40 bg-blue-500/10 text-blue-400 text-xs font-bold hover:bg-blue-500/20 transition">📍 Abrir en Google Maps</a>
          )}

          {!past && isAdmin && g.length >= 2 && (
            <button onClick={() => onTeams(ev.id)} className="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold transition">⚖️ Armar equipos con los {Math.min(g.length, ev.cap)} convocados</button>
          )}

          {!past && (
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => waShare(evText(ev))} className="py-2 rounded-xl border border-emerald-500/50 bg-emerald-500/10 text-emerald-300 text-xs font-bold hover:bg-emerald-500/20 transition">
                Enviar al WhatsApp 💬
              </button>
              <button onClick={() => copy('l' + ev.id, evLink(ev.id))} className="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition">
                {cp === 'l' + ev.id ? '¡Link copiado! ✅' : '🔗 Copiar link'}
              </button>
            </div>
          )}

          {!past && isAdmin && (
            <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-2.5 space-y-1.5">
              <p className="text-[11px] font-bold text-amber-400">📢 Avisos al grupo (solo admins)</p>
              <div className="grid gap-1.5">
                <button onClick={() => waShare(evOpen(ev))} className="py-2 rounded-xl bg-emerald-600/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-600/25 transition">🔥 Ya está abierta la lista, anótense</button>
                <button onClick={() => waShare(evList(ev))} className="py-2 rounded-xl bg-orange-500/15 border border-orange-500/40 text-orange-300 text-xs font-bold hover:bg-orange-500/25 transition">📋 Enviar la lista (1 a {ev.cap})</button>
                <button onClick={() => waShare(evSpots(ev))} className="py-2 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/25 transition">⚠️ Cupos limitados ({Math.max(0, ev.cap - g.length)} libres)</button>
                {ev.fee > 0 && (
                  <button onClick={() => waShare(evPay(ev))} className="py-2 rounded-xl bg-purple-500/15 border border-purple-500/40 text-purple-300 text-xs font-bold hover:bg-purple-500/25 transition">💸 Falta pagar ({g.slice(0, ev.cap).filter((id) => pays[id] !== 'ok').length})</button>
                )}
              </div>
              <p className="text-[10px] text-slate-500">Se abre WhatsApp con el mensaje listo; solo elige el grupo y envía.</p>
            </div>
          )}

          {ev.fee > 0 && (
            <div className="border-t border-slate-800 pt-3 space-y-2">
              <div className="flex justify-between text-sm">
                <b>💰 Cuota: S/ {ev.fee}</b>
                {!past && <span className={`text-[11px] font-bold ${payClosed(ev) ? 'text-rose-400' : 'text-amber-400'}`}>{payClosed(ev) ? '⛔ Plazo de pago vencido' : `⏰ Paga antes del ${fmtDL(ev)}`}</span>}
              </div>
              {!past && payClosed(ev) && inRaw && !iGo && (
                <p className="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-xl p-2 font-bold text-center">Perdiste tu cupo por no pagar a tiempo. Si ya pagaste, avisa abajo y un admin lo confirma.</p>
              )}

              <div className="flex items-center justify-between gap-2 bg-purple-500/10 border border-purple-500/30 rounded-xl p-2.5">
                <div>
                  <p className="text-[10px] text-slate-400">Yape a nombre de {YAPE_NAME}</p>
                  <b className="num text-2xl text-purple-400">{YAPE_NUM}</b>
                </div>
                <button onClick={() => copy('y' + ev.id, YAPE_NUM.replace(/\s/g, ''))} className="px-3 py-1.5 rounded-xl bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-bold">
                  {cp === 'y' + ev.id ? '¡Copiado! ✅' : 'Copiar número'}
                </button>
              </div>

              {(iGo || inRaw) && (
                mine === 'ok' ? (
                  <p className="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2 font-bold text-center">✅ Tu pago de cancha está confirmado</p>
                ) : mine === 'pending' ? (
                  <div className="space-y-1.5">
                    <p className="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-xl p-2 font-bold text-center">⏳ Pago avisado. Un admin lo confirmará con el ✓.</p>
                    <button onClick={() => payYape(ev)} className="w-full py-1.5 rounded-xl bg-slate-800 text-slate-300 text-[11px] font-bold">Reenviar aviso a {YAPE_NAME} por WhatsApp 💬</button>
                  </div>
                ) : (
                  <button onClick={() => payYape(ev)} className="w-full py-2 rounded-xl border border-purple-500/60 bg-purple-500/10 text-purple-300 text-xs font-bold hover:bg-purple-500/20 transition">
                    Ya yapeé · avisar a {YAPE_NAME} por WhatsApp 💬
                  </button>
                )
              )}

              {isAdmin && payClosed(ev) && raw.length > g.length && (
                <button onClick={() => confirm(`¿Quitar de la lista a los ${raw.length - g.length} que no pagaron?`) && db.collection('events').doc(ev.id).update({ going: FV.arrayRemove(...raw.filter((id) => !g.includes(id))) })} className="w-full py-2 rounded-xl border border-rose-500/50 bg-rose-500/10 text-rose-300 text-xs font-bold">
                  Quitar de la lista a los {raw.length - g.length} que no pagaron ✂️
                </button>
              )}
              <p className="text-xs text-slate-400">
                Recaudado: <b className="text-emerald-400">S/ {ok * ev.fee}</b> de S/ {g.length * ev.fee}
              </p>

              {canManage && g.length > 0 && (
                <div className="space-y-1.5 pt-1">
                  <p className="text-[11px] font-bold text-amber-400">Control de cobros (solo admins pueden poner el ✓):</p>
                  {g.map((id) => {
                    const p = byId(id), st = pays[id];
                    if (!p) return null;
                    return (
                      <div key={id} className="flex items-center justify-between text-xs bg-slate-950 rounded-xl px-2.5 py-1.5 border border-slate-800">
                        <span>{p.avatar} {p.nickname}</span>
                        <div className="flex items-center gap-2">
                          <span className={st === 'ok' ? 'text-emerald-400 font-bold' : st === 'pending' ? 'text-amber-400 font-bold' : 'text-slate-500'}>
                            {st === 'ok' ? 'Pagado' : st === 'pending' ? 'Avisó pago' : 'Debe'}
                          </span>
                          {st !== 'ok' ? (
                            <button onClick={() => setPaid(ev, id, 'ok')} title="Aprobar pago" className="px-2 py-0.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold">✓</button>
                          ) : (
                            <button onClick={() => setPaid(ev, id, null)} title="Revertir pago" className="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white">↺</button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      </article>
    );
  };

  const all = events.filter((e) => e.date).sort((a, b) => when(a) - when(b));
  const limit = Date.now() - 6 * 36e5;
  const up = all.filter((e) => when(e) >= limit);
  const past = all.filter((e) => when(e) < limit);
  const fund = fundOf(events, me.id);

  return (
    <div className="space-y-4">
      {isAdmin && (
        <button onClick={() => setOpen(!open)} className="btn-fire w-full py-2.5 rounded-xl text-sm shadow">
          {open ? 'Cerrar formulario' : '+ Nueva convocatoria de pichanga'}
        </button>
      )}

      <div className={card + ' space-y-1'}>
        <div className="flex items-center justify-between"><b className="text-sm">🏦 Fondo del grupo</b><span className="num text-xl text-emerald-400 font-black">S/ {fund.paid}</span></div>
        <p className="text-[11px] text-slate-400">Llegar tarde = multa de S/ {LATE_FEE} que va al fondo.{fund.due > 0 ? ` Por cobrar: S/ ${fund.due}.` : ''}</p>
        {fund.mine > 0 && <p className="text-xs text-rose-400 font-bold">Tienes S/ {fund.mine} de multas por pagar.</p>}
      </div>

      {created && (
        <div className={card + ' border-emerald-500/40 space-y-2.5 enter'}>
          <p className="text-sm font-bold text-emerald-400">✅ ¡Pichanga publicada! Ahora avisa al grupo</p>
          <p className="text-[11px] text-slate-400">Al tocar el link, la gente entra directo a esta pichanga para anotarse.</p>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => waShare(evOpen(created))} className="flex-1 min-w-[160px] py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition">Avisar al grupo: lista abierta 💬</button>
            <button onClick={() => copy('new', evLink(created.id))} className="flex-1 min-w-[140px] py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition">{cp === 'new' ? '¡Copiado! ✅' : '🔗 Copiar link'}</button>
            <button onClick={() => setCreated(null)} className="px-3 py-2.5 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold">Cerrar</button>
          </div>
        </div>
      )}

      {open && (
        <form onSubmit={create} className={card + ' space-y-2.5 enter'}>
          <p className="text-sm font-bold text-amber-400">Crear convocatoria</p>
          <input required className={inp} placeholder="Título (ej. Pichanga Sábado por la tarde)" value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <input required type="date" className={inp} value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} />
            <input type="time" className={inp} value={f.time} onChange={(e) => setF({ ...f, time: e.target.value })} />
          </div>
          <input className={inp} placeholder="Lugar (ej. Cancha Papú, Coliseo Berlín...)" value={f.place} onChange={(e) => setF({ ...f, place: e.target.value })} />
          <input className={inp} placeholder="🗺 Link de Google Maps (pega el link de la cancha)" value={f.maps} onChange={(e) => setF({ ...f, maps: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <input type="number" min="0" step="0.5" className={inp} placeholder="Cuota por persona (S/)" value={f.fee} onChange={(e) => setF({ ...f, fee: e.target.value })} />
            <input type="number" min="2" className={inp} placeholder="Cupos (ej. 12)" value={f.cap} onChange={(e) => setF({ ...f, cap: e.target.value })} />
          </div>
          <p className="text-[11px] text-slate-400">💜 El Yape de cobro es siempre el de {YAPE_NAME}: {YAPE_NUM}</p>
          <button className="btn-fire w-full py-2.5 rounded-xl text-sm font-black shadow mt-1">Publicar Convocatoria</button>
        </form>
      )}

      {up.length === 0 && !open && (
        <p className="text-center text-sm text-slate-500 py-10">No hay pichangas convocadas por el momento. ¡Atentos al muro!</p>
      )}

      {up.map((e) => renderEv(e, false))}

      {past.length > 0 && (
        <div className="pt-2">
          <p className="text-xs font-bold text-slate-500 mb-2">Partidos anteriores</p>
          {past.filter((e, i) => i >= past.length - 3 || e.id === focusId).reverse().map((e) => renderEv(e, true))}
        </div>
      )}
    </div>
  );
}

// ===== PANEL DE ADMINISTRADORES (EXCLUSIVO JUSTIN & YULISA) =====
function AdminPanel({ me, players }) {
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [msgPost, setMsgPost] = useState('');

  const updateSkills = async () => {
    if (!selectedPlayer) return;
    await db.collection('players').doc(selectedPlayer.id).update({
      skills: selectedPlayer.skills,
      position: selectedPlayer.position
    });
    alert(`¡Habilidades de ${selectedPlayer.nickname} actualizadas con éxito!`);
    setSelectedPlayer(null);
  };

  const toggleAdmin = async (p) => {
    const msg = p.isAdmin ? `¿Quitar admin a ${p.nickname}?` : `¿Hacer admin a ${p.nickname}?`;
    if (!confirm(msg)) return;
    await db.collection('players').doc(p.id).update({ isAdmin: !p.isAdmin });
  };

  const publishOfficialNotice = async (e) => {
    e.preventDefault();
    if (!msgPost.trim()) return;
    await db.collection('posts').add({
      authorId: me.id,
      authorName: me.name,
      nick: me.nickname,
      avatar: '🛡️',
      content: msgPost.trim(),
      badge: '⭐ Comunicado Admin',
      likes: [],
      comments: [],
      createdAt: Date.now()
    });
    setMsgPost('');
    alert('Comunicado oficial publicado en el muro.');
  };

  return (
    <div className="space-y-4 enter">
      <div className={card + ' border-amber-500/40 bg-gradient-to-r from-amber-500/10 to-orange-500/5'}>
        <div className="flex items-center gap-2 text-amber-400 font-bold text-base">
          <span>🛡️</span>
          <span>Panel Oficial de Administradores</span>
        </div>
        <p className="text-xs text-slate-300 mt-1 leading-relaxed">
          Bienvenido, <b>{me.nickname}</b>. Como administradores de AceFire, aquí pueden calibrar el nivel de los chicos para que el algoritmo arme sextetos parejos y publicar avisos con prioridad.
        </p>
      </div>

      {/* Publicar Comunicado Oficial */}

        <p className="text-xs font-bold text-amber-400">📢 Emitir Comunicado Oficial Fijado</p>
        <textarea rows={2} className={inp + ' resize-none'} placeholder="Escribe el aviso importante para todo el grupo de vóley..." value={msgPost} onChange={(e) => setMsgPost(e.target.value)} />
        <button disabled={!msgPost.trim()} className="btn-fire px-4 py-2 rounded-xl text-xs font-black disabled:opacity-40">Publicar como Admin</button>
      </form>

      {/* Editor de habilidades de los chicos */}
      <div className={card + ' space-y-3'}>
        <div className="flex justify-between items-center">
          <p className="text-sm font-bold text-amber-400">Calibración Técnica de Jugadores ({players.length})</p>
          <span className="text-[10px] text-slate-500">Ajusta notas para evitar desbalances</span>
        </div>

        <div className="divide-y divide-slate-800 max-h-96 overflow-y-auto">
          {players.map((p) => (
            <div key={p.id} className="py-2.5 flex justify-between items-center text-xs">
              <div className="flex items-center gap-2">
                <span className="text-lg">{p.avatar}</span>
                <div>
                  <b className="text-slate-200">{p.nickname}</b> <span className="text-slate-500">({p.name})</span>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <Badge id={p.position} />
                    <span className="text-amber-400 font-mono font-bold">⭐ {ovr(p.skills).toFixed(1)}</span>
                  </div>
                </div>
              </div>
              <button onClick={() => setSelectedPlayer(JSON.parse(JSON.stringify(p)))} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 rounded-xl font-bold transition">
                Calibrar ⚙️
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* Administradores */}
      <div className={card + ' space-y-3'}>
        <div>
          <p className="text-sm font-bold text-amber-400">👥 Administradores</p>
          <p className="text-[11px] text-slate-400">Quien se registre aparece aquí. Hazlo admin con un toque.</p>

        <div className="divide-y divide-slate-800 max-h-72 overflow-y-auto">
          {players.map((p) => {
            const isOwnerP = ADMIN_EMAILS.includes((p.email || '').toLowerCase());
            return (
              <div key={p.id} className="py-2.5 flex justify-between items-center text-xs">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="text-lg">{p.avatar}</span>
                  <div className="min-w-0">
                    <b className="text-slate-200">{p.nickname}</b>
                    <p className="text-[10px] text-slate-500 truncate">{p.email || p.name}</p>
                  </div>
                </div>
                {isOwnerP ? (
                  <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2 py-1 rounded-lg">Dueño</span>
                ) : (
                  <button onClick={() => toggleAdmin(p)} className={p.isAdmin ? 'px-3 py-1.5 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 font-bold' : 'px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-bold'}>
                    {p.isAdmin ? 'Quitar admin' : 'Hacer admin'}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Modal de calibración */}
      {selectedPlayer && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-3 text-xs enter shadow-2xl">
            <div className="flex justify-between items-center border-b border-slate-800 pb-2">
              <b className="text-sm text-amber-400">Ajustar notas de {selectedPlayer.nickname}</b>
              <button onClick={() => setSelectedPlayer(null)} className="text-slate-400 hover:text-white text-base">✕</button>
            </div>

// ===== REGISTRO DE PARTIDOS (MODAL DE RESULTADO) =====
function MatchModal({ players, init, onClose }) {
  const [side, setSide] = useState(() => {
    const s = {};
    (init.a || []).forEach((i) => (s[i] = 'A'));
    (init.b || []).forEach((i) => (s[i] = 'B'));
    return s;
  });
  const [sa, setSa] = useState(2);
  const [sb, setSb] = useState(0);
  const [mvp, setMvp] = useState('');

  const cyc = (id) => {
    const c = side[id];
    const nx = { ...side };
    if (!c) nx[id] = 'A';
    else if (c === 'A') nx[id] = 'B';
    else delete nx[id];
    setSide(nx);
  };

  const A = Object.keys(side).filter((i) => side[i] === 'A');
  const B = Object.keys(side).filter((i) => side[i] === 'B');

  const submit = async (e) => {
    e.preventDefault();
    if (!A.length || !B.length) return alert('Debes marcar al menos un jugador en cada equipo.');
    if (sa === sb) return alert('Los sets no pueden quedar empatados.');

    const winA = sa > sb, W = winA ? A : B, L = winA ? B : A, ws = winA ? sa : sb;
    const batch = db.batch();

    W.forEach((id) => batch.update(db.collection('players').doc(id), {
      matchesWon: FV.increment(1),
      setsWon: FV.increment(ws)
    }));
    L.forEach((id) => batch.update(db.collection('players').doc(id), {
      matchesLost: FV.increment(1)
    }));
    if (mvp) {
      batch.update(db.collection('players').doc(mvp), { mvpCount: FV.increment(1) });
    }

    batch.set(db.collection('matches').doc(), {
      teamA: A,
      teamB: B,
      scoreA: sa,
      scoreB: sb,
      mvp,
      createdAt: Date.now()
    });

    const names = (ids) => ids.map((i) => players.find((p) => p.id === i)?.nickname || 'Jugador').join(', ');
    const m = players.find((p) => p.id === mvp);

    batch.set(db.collection('posts').doc(), {
      authorId: 'bot',
      authorName: 'AceFire Árbitro',
      nick: 'arbitro',
      avatar: '🏆',
      content: `🏆 ¡RESULTADO OFICIAL REGISTRADO!\n\n🔥 Marcador: Equipo A (${sa}) - (${sb}) Equipo B\n\n🔵 Equipo A: ${names(A)}\n🔴 Equipo B: ${names(B)}${m ? `\n\n⭐ JUGADOR MVP: ${m.nickname} ${m.avatar}` : ''}`,
      badge: '🔥 Resultado',
      likes: [],
      comments: [],
      createdAt: Date.now()
    });

    await batch.commit();
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
      <form onSubmit={submit} className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto p-5 space-y-3 text-sm enter shadow-2xl">
        <div className="flex justify-between items-center border-b border-slate-800 pb-2">
          <b className="text-base text-amber-400">Registrar Partido Oficial</b>
          <button type="button" onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
        </div>

        <p className="text-xs text-slate-400 leading-relaxed">
          Toca a los jugadores para armar los bandos: <span className="text-blue-400 font-bold">1 toque = Equipo A</span>, <span className="text-rose-400 font-bold">2 toques = Equipo B</span>, 3 = Fuera.
        </p>

        <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1">
          {players.map((p) => {
            const sideCode = side[p.id];
            return (
              <button type="button" key={p.id} onClick={() => cyc(p.id)} className={`p-2 rounded-xl border text-left flex justify-between items-center transition ${sideCode === 'A' ? 'bg-blue-600/25 border-blue-500 text-blue-200' : sideCode === 'B' ? 'bg-rose-600/25 border-rose-500 text-rose-200' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>
                <span className="truncate">{p.avatar} {p.nickname}</span>
                <b className="font-bold">{sideCode || '-'}</b>
              </button>
            );
          })}
        </div>

        <div className="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-800">
          <label className="text-xs text-slate-400">Sets Equipo A
            <input type="number" min="0" max="5" className={inp + ' mt-1 font-bold text-center'} value={sa} onChange={(e) => setSa(+e.target.value || 0)} />
          </label>
          <label className="text-xs text-slate-400">Sets Equipo B
            <input type="number" min="0" max="5" className={inp + ' mt-1 font-bold text-center'} value={sb} onChange={(e) => setSb(+e.target.value || 0)} />
          </label>
        </div>

        <div>
          <label className="block text-xs text-slate-400 mb-1">Elegir MVP del partido</label>
          <select className={inp} value={mvp} onChange={(e) => setMvp(e.target.value)}>
            <option value="">⭐ Selecciona el mejor jugador (opcional)</option>
            {players.map((p) => <option key={p.id} value={p.id}>{p.avatar} {p.nickname}</option>)}
          </select>
        </div>

        <div className="flex gap-2 pt-2">
          <button type="button" onClick={onClose} className="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition">Cancelar</button>
          <button className="btn-fire w-1/2 py-2.5 rounded-xl font-black shadow transition">Guardar en Ranking</button>
        </div>
      </form>
    </div>
  );
}

function ProfilePage({ id, me, players, posts, isAdmin, onProfile, onClose, onMessage }) {

  const list = posts.filter((x) => x.wallOwner === p.id || (x.authorId === p.id && !x.wallOwner)).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);

  const since = p.createdAt ? `${MESES[new Date(p.createdAt).getMonth()]} de ${new Date(p.createdAt).getFullYear()}` : '';

    setBusy(true);
    try {
      const photo = await fileToDataUrl(f, 320, 0.75);

  const saveEd = async (e) => {
    e.preventDefault();
    try {
      await db.collection('players').doc(p.id).update({ nickname: ed.nickname.trim() || p.nickname, avatar: ed.avatar, phone: ed.phone.trim() });

  const copyLink = () => {

    <div className="space-y-3 enter">

            </div>
          </div>

          <div className="mt-2">
            <b className="text-2xl text-slate-100 block leading-tight">{p.nickname}</b>
            <p className="text-sm text-slate-400">{p.name}</p>
            <div className="flex flex-wrap items-center gap-2 mt-1.5">
              <Badge id={p.position} />
              <span className="text-xs font-black text-amber-400">⭐ {ovr(p.skills).toFixed(1)} OVR</span>
              {p.isAdmin && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 border border-amber-500/30">Admin</span>}
              {since && <span className="text-[11px] text-slate-500">En AceFire desde {since}</span>}

          </div>

          {mine && (

              <button onClick={() => setEd(ed ? null : { nickname: p.nickname || '', avatar: p.avatar || '🏐', phone: p.phone || '' })} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold transition">✏️ Editar datos</button>

      <div className="grid grid-cols-4 gap-2 text-center">
