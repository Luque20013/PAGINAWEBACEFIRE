/* ===== TOKENS: oscuro (cancha de noche, por defecto) y claro (cancha de día) ===== */
:root {
  --s950: 244 246 249; --s900: 255 255 255; --s800: 226 230 237; --s700: 208 213 221; --s600: 152 162 179;
  --s500: 123 133 153; --s400: 91 102 122; --s300: 61 72 92; --s200: 29 41 57; --s100: 16 24 40; --s50: 16 24 40;
  --fire: 244 81 30;
  --am300: 232 89 12; --am400: 217 72 15; --am500: 244 81 30; --am600: 200 60 10;
  --em300: 11 122 85; --em400: 14 143 99; --em500: 18 178 122; --em600: 14 159 110;
  --ro300: 190 18 60; --ro400: 225 29 72; --ro500: 244 63 94; --ro600: 225 29 72;
  --bl200: 30 64 175; --bl400: 37 99 235; --bl500: 59 130 246; --bl600: 37 99 235;

}

  --s950: 7 11 20; --s900: 14 21 36; --s800: 30 41 64; --s700: 44 58 87; --s600: 74 90 122;
  --s500: 124 139 166; --s400: 154 167 190; --s300: 188 198 216; --s200: 220 227 239; --s100: 238 242 248; --s50: 248 250 253;
  --fire: 255 106 43;
  --am300: 255 192 120; --am400: 255 169 77; --am500: 255 106 43; --am600: 234 88 12;
  --em300: 110 231 183; --em400: 52 211 153; --em500: 16 185 129; --em600: 5 150 105;

}
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  font-family: 'Archivo', system-ui, sans-serif;
  background-color: rgb(var(--s950));
  background-image:
    radial-gradient(900px 520px at 50% -140px, rgb(var(--fire) / .17), transparent 70%),
    radial-gradient(700px 420px at 100% 100%, rgb(var(--bl500) / .10), transparent 70%);
  background-attachment: fixed;
  color: rgb(var(--s100));
  -webkit-font-smoothing: antialiased;
}
html[data-theme="light"] body {
  background-image:
    radial-gradient(900px 480px at 50% -160px, rgb(var(--fire) / .10), transparent 70%);
}
/* Marca */
.logo { font-family: 'Archivo', system-ui, sans-serif; font-stretch: 125%; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: rgb(var(--s100)); }
.fire { color: rgb(var(--fire)); }
.logo .fire { background: linear-gradient(135deg, #FFB347, rgb(var(--fire)) 60%, #E8340F); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.af-mark { width: 32px; height: 32px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; background: linear-gradient(135deg, #FF8A3D, #E8340F); box-shadow: 0 6px 16px -6px rgb(var(--fire) / .8), inset 0 1px 0 rgb(255 255 255 / .35); }
.num { font-stretch: 62%; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: .9; }
.font-mono { font-family: 'Archivo', system-ui, sans-serif !important; font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; }
/* Cabecera y barra inferior flotante */
.hdr { background: rgb(var(--s900) / .78); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid rgb(var(--s100) / .07); }
.tabbar {
  left: 50% !important; right: auto !important; transform: translateX(-50%);
  width: calc(100% - 20px); max-width: 640px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
  background: rgb(var(--s900) / .82);
  -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);

function useCol(name, q) {
  const [d, setD] = useState(null);
  useEffect(() => (q ? q(db.collection(name)) : db.collection(name)).onSnapshot(

  ), [name]);
  return d;
}

const fileToDataUrl = (file, max = 900, q = 0.72) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = () => rej(new Error('read'));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => rej(new Error('img'));
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let out = c.toDataURL('image/jpeg', q);
      if (out.length > 600000) out = c.toDataURL('image/jpeg', 0.5);
      res(out);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/missing-password': 'Escribe tu contraseña.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
    'auth/operation-not-allowed': 'Falta activar Correo/Contraseña en Firebase Authentication.',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar.',
    'auth/popup-blocked': 'Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes.',
    'auth/unauthorized-domain': 'Este link no está autorizado en Firebase (Authentication > Configuración > Dominios autorizados).',
    'auth/operation-not-supported-in-this-environment': 'Entrar con Google solo funciona desde un link publicado (como Netlify), no abriendo el archivo local.',
    'auth/configuration-not-found': 'Falta activar Authentication en Firebase (Comenzar, y luego Correo/Contraseña).'
  }[e.code] || ('Error: ' + (e.code || e.message)));

  const login = async (e) => {
    e.preventDefault(); setErr(''); setInfo(''); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(acc.email.trim(), acc.pass);

      setErr(msg(x));

        <form onSubmit={register} className={card + ' space-y-3'}>
          <p className="text-sm font-bold text-amber-400">{mode === 'complete' ? 'Completa tu ficha deportiva' : 'Crear mi cuenta de jugador'}</p>
          {mode === 'register' && (

// ===== TABLA DE POSICIONES Y RANKING =====
function Ranking({ players, onProfile }) {
  const rows = useMemo(() => [...players].sort((a, b) => {
    const ta = (a.matchesWon || 0) + (a.matchesLost || 0);
    const tb = (b.matchesWon || 0) + (b.matchesLost || 0);
    const wa = ta ? (a.matchesWon || 0) / ta : 0;
    const wb = tb ? (b.matchesWon || 0) / tb : 0;
    return wb - wa || (b.matchesWon || 0) - (a.matchesWon || 0) || (b.setsWon || 0) - (a.setsWon || 0);
  }), [players]);

  const eff = (p) => { const t = (p.matchesWon || 0) + (p.matchesLost || 0); return t ? Math.round(((p.matchesWon || 0) / t) * 100) : 0; };
  const top = rows.slice(0, 3);
  const podium = top.length === 3 ? [[top[1], 2, '🥈'], [top[0], 1, '👑'], [top[2], 3, '🥉']] : [];

  return (
    <div className="space-y-3">
    {podium.length > 0 && (
      <div className="grid grid-cols-3 gap-2 items-end px-1 pt-2">
        {podium.map(([p, n, medal]) => (
          <button key={p.id} onClick={() => onProfile(p.id)} className={`pod pod-${n} enter`}>
            <span className="text-xl leading-none mb-1">{medal}</span>
            <Av p={p} size={n === 1 ? 'w-14 h-14' : 'w-11 h-11'} text={n === 1 ? 'text-3xl' : 'text-2xl'} />
            <b className="text-sm text-slate-100 mt-1.5 truncate max-w-full">{p.nickname}</b>
            <span className="num text-2xl text-amber-400 mt-1">{eff(p)}%</span>
            <span className="text-[10px] text-slate-400">{p.matchesWon || 0}G · {p.matchesLost || 0}P</span>
          </button>
        ))}
      </div>
    )}
    <div className={card + ' !p-0 overflow-hidden'}>
      <div className="p-3 bg-slate-900 border-b border-slate-800 text-xs font-bold flex justify-between items-center text-amber-400">
        <span>🏆 Tabla de Eficacia & Quién Gana</span>
        <span className="text-slate-400 font-normal">G / P · Efic · Sets · MVP</span>
      </div>

      <div className="divide-y divide-slate-800/80">
        {rows.map((p, i) => {
          const t = (p.matchesWon || 0) + (p.matchesLost || 0);
          const winRate = t ? Math.round(((p.matchesWon || 0) / t) * 100) : 0;
          return (
            <div key={p.id} onClick={() => onProfile(p.id)} className="p-3 flex justify-between items-center text-xs hover:bg-slate-800/30 transition cursor-pointer">
              <div className="flex items-center gap-2.5">
                <span className={`w-6 text-center font-bold text-sm ${i === 0 ? 'text-amber-400' : i === 1 ? 'text-slate-300' : i === 2 ? 'text-amber-600' : 'text-slate-500'}`}>
                  {i === 0 ? '👑' : i + 1}
                </span>
                <Av p={p} size="w-8 h-8" text="text-xl" />
                <div>
                  <div className="flex items-center gap-1.5">
                    <b className="text-sm text-slate-200">{p.nickname}</b>
                    <Badge id={p.position} />
                  </div>
                  <p className="text-[10px] text-slate-500">{p.name}</p>
                </div>
              </div>

              <div className="font-mono flex items-center gap-3">
                <span className="text-xs">
                  <b className="text-emerald-400">{p.matchesWon || 0}</b>
                  <span className="text-slate-600">/</span>
                  <b className="text-rose-400">{p.matchesLost || 0}</b>
                </span>
                <span className="text-amber-400 font-bold w-10 text-right">{winRate}%</span>
                <span className="w-6 text-right text-slate-300">{p.setsWon || 0}s</span>
                <span className="w-8 text-right text-amber-300 font-bold">⭐{p.mvpCount || 0}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
    </div>
  );
}

// ===== ARMADO INTELIGENTE DE EQUIPOS =====
function Teams({ players, events, initialEv, onRegister, isAdmin }) {
  const [off, setOff] = useState([]);
  const upcoming = events.filter((e) => e.date && when(e) >= Date.now() - 6 * 36e5).sort((a, b) => when(a) - when(b));
  const [sel, setSel] = useState(initialEv || (upcoming[0] ? upcoming[0].id : 'all'));
  const ev = events.find((e) => e.id === sel);
  const opts = ev && !upcoming.find((e) => e.id === ev.id) ? [ev, ...upcoming] : upcoming;
  const base = ev ? (ev.going || []).slice(0, ev.cap || 12).map((id) => players.find((p) => p.id === id)).filter(Boolean) : players;
  const waiting = ev ? Math.max(0, (ev.going || []).length - (ev.cap || 12)) : 0;

  const [n, setN] = useState(2);
  const [res, setRes] = useState(null);
  const [ok, setOk] = useState(false);

  const pool = base.filter((p) => !off.includes(p.id));

  const gen = () => {
    const T = Array.from({ length: n }, (_, i) => ({
      name: 'Equipo ' + String.fromCharCode(65 + i),
      pl: [],
      tot: 0
    }));

    // Reparto por posiciones para garantizar balance técnico
    ['armador', 'central', 'punta', 'opuesto', 'libero'].forEach((pos) => {
      pool.filter((p) => p.position === pos)
        .sort((a, b) => ovr(b.skills) - ovr(a.skills))
        .forEach((p) => {
          T.sort((a, b) => 
            (a.pl.filter((x) => x.position === pos).length - b.pl.filter((x) => x.position === pos).length) ||
            (a.pl.length - b.pl.length) ||
            (a.tot - b.tot)
          );
          T[0].pl.push(p);
          T[0].tot += ovr(p.skills);
        });
    });

    setRes(T.sort((a, b) => a.name.localeCompare(b.name)));
  };

  const copy = (sendWa) => {
    let t = '🏐 *ACEFIRE - EQUIPOS BALANCEADOS* 🏐\n' + (ev ? `📅 ${ev.title} · ${ev.date} ${ev.time}\n` : '') + '\n';
    res.forEach((e) => {
      const avg = (e.tot / (e.pl.length || 1)).toFixed(1);
      t += `🔥 *${e.name.toUpperCase()}* (Nivel: ⭐ ${avg})\n`;
      e.pl.forEach((p, i) => {
        const badge = POS.find((x) => x.id === p.position)?.s || 'JUG';
        t += `  ${i + 1}. ${p.nickname} [${badge}]\n`;
      });
      t += '\n';
    });
    const full = t + '⏰ Llegar 15 min antes para calentar y armar la cancha.\n\n🔥 Ranking y resultados: ' + SITE_URL;
    if (navigator.clipboard) navigator.clipboard.writeText(full).catch(() => {});
    if (sendWa === true) waShare(full);
    setOk(true);
    setTimeout(() => setOk(false), 2500);
  };

  return (
    <div className="space-y-3">
      <div className={card + ' space-y-3'}>
        <div className="flex justify-between items-center">
          <p className="text-sm font-bold text-amber-400">{ev ? 'Convocados de la pichanga' : 'Selecciona quiénes vinieron hoy'} ({pool.length} activos)</p>
          <button onClick={() => setOff([])} className="text-xs text-slate-400 hover:text-slate-200 underline">Marcar todos</button>
        </div>

        <select className={inp} value={sel} onChange={(e) => { setSel(e.target.value); setOff([]); setRes(null); }}>
          {opts.map((e) => <option key={e.id} value={e.id}>🏐 {e.title} · {e.date} {e.time} ({Math.min((e.going || []).length, e.cap || 12)} convocados)</option>)}
          <option value="all">👥 Todos los jugadores (manual)</option>
        </select>
        {ev && waiting > 0 && <p className="text-[11px] text-amber-400">+{waiting} en lista de espera no entran a los equipos.</p>}
        {ev && base.length === 0 && <p className="text-xs text-slate-500">Nadie se ha anotado a esta pichanga todavía.</p>}

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-60 overflow-y-auto p-1">
          {base.map((p) => {
            const isInactive = off.includes(p.id);
            return (
              <button key={p.id} onClick={() => setOff(isInactive ? off.filter((x) => x !== p.id) : [...off, p.id])} className={`p-2 rounded-xl border text-xs text-left flex justify-between items-center transition ${isInactive ? 'bg-slate-950 border-slate-800 text-slate-500 opacity-50' : 'bg-amber-500/10 border-amber-500/40 text-slate-200'}`}>
                <span className="truncate">{p.avatar} {p.nickname}</span>
                <span className="text-[10px] font-mono text-amber-400 font-bold">{ovr(p.skills).toFixed(1)}⭐</span>
              </button>
            );
          })}
        </div>

        <div className="flex justify-between items-center pt-2 border-t border-slate-800">
          <div className="flex gap-1.5">
            {[2, 3].map((k) => (
              <button key={k} onClick={() => setN(k)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${n === k ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>
                {k} Equipos
              </button>
            ))}
          </div>
          <button onClick={gen} disabled={pool.length < n * 2} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl disabled:opacity-40 shadow transition">
            Balancear Equipos
          </button>
        </div>
      </div>

      {res && (
        <div className="space-y-3 enter">
          <div className="grid sm:grid-cols-2 gap-3">
            {res.map((e) => (
              <div key={e.name} className={card + ' !p-0 overflow-hidden'}>
                <div className="p-3 bg-slate-800/80 flex justify-between items-center border-b border-slate-700/50">
                  <b className="text-amber-400">{e.name}</b>
                  <span className="text-xs font-mono text-amber-300 font-bold">⭐ Prom: {(e.tot / (e.pl.length || 1)).toFixed(1)}</span>
                </div>
                <div className="p-3 divide-y divide-slate-800/80">
                  {e.pl.map((p) => (
                    <div key={p.id} className="py-1.5 flex justify-between items-center text-sm">
                      <span className="text-slate-200">{p.avatar} {p.nickname}</span>
                      <Badge id={p.position} />
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="flex flex-wrap gap-2">
            <button onClick={() => copy(true)} className="flex-1 min-w-[150px] py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow">
              Enviar al grupo de WhatsApp 💬
            </button>
            <button onClick={() => copy(false)} className="flex-1 min-w-[150px] py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition shadow">

                Registrar resultado A vs B 🏆
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
